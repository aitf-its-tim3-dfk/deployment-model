openapi: 3.1.0
info:
  title: DFK Model API Reference
  description: |
    Unified API reference for three DFK (social media content violation classification) model deployments on Modal.

    | Model | Endpoint |
    |-------|----------|
    | **Qwen-0.8B-v2** | `https://dfk-3--qwen35-ws3-v2-infer.modal.run` |
    | **Ministral-8B-CPT** | `https://dfk-3--ministral-cpt-8b-ws3-infer.modal.run` |
    | **Ministral-8B-Merged** | `https://dfk-3--ministral-8b-merged-ws3-infer.modal.run` |

    Each model has its own endpoint. The server URL is shown on each operation — click it to change.

    All modes use `POST /` on the respective server.
  version: 1.0.0
servers:
  - url: https://dfk-3--ministral-8b-merged-ws3-infer.modal.run
    description: Ministral-8B-Merged (Production)
  - url: https://dfk-3--ministral-cpt-8b-ws3-infer.modal.run
    description: Ministral-8B-CPT (Production)
  - url: https://dfk-3--qwen35-ws3-v2-infer.modal.run
    description: Qwen-0.8B-v2 (Production)

tags:
  - name: Qwen-0.8B-v2
    description: |
      `aitf-its-tim3-dfk/KomdigiITS-0.8B-DFK-MultimodalClassification`
      — Qwen3.5-0.8B VLM with updated DFK adapter. Lightweight and fast.

      **Endpoint:** `https://dfk-3--qwen35-ws3-v2-infer.modal.run`

      Modes: DFK-3 · Captioning · Free prompt · Messages
  - name: Ministral-8B-CPT
    description: |
      `aitf-its-tim3-dfk/ministral-cpt-8b-ws3`
      — Ministral-3-8B with continued pre-training (CPT) on domain data, then SFT fine-tuned for DFK.

      **Endpoint:** `https://dfk-3--ministral-cpt-8b-ws3-infer.modal.run`

      Modes: DFK-3 · Captioning · Free prompt · Messages
  - name: Ministral-8B-Merged
    description: |
      `aitf-its-tim3-dfk/ministral-8b-merged-ws3`
      — Ministral adapter-mode deployment. Loads only the LoRA adapter (`adapter/` subfolder) for full adapter control.

      **Endpoint:** `https://dfk-3--ministral-8b-merged-ws3-infer.modal.run`

      Modes: DFK-3 · DFK-1 text · Captioning · Adapter captioning · Free prompt · Messages · Adapter messages

paths:

  # ─────────────────────────────────────────
  # QWEN-0.8B-v2
  # ─────────────────────────────────────────

  /#qwen-v2-dfk-3:
    post:
      tags: [Qwen-0.8B-v2]
      summary: DFK-3 Multimodal Classification
      description: |
        Default mode. Pass `ringkasan`, `klaim`, `fakta` — optionally with `image_url`.
        Returns generated text + MTLA logits scores over 4 labels: `NETRAL` · `DISINFORMASI` · `UJARAN KEBENCIAN` · `FITNAH`

        > **Actual endpoint:** `POST /`
      operationId: qwen_v2_dfk_3
      servers:
        - url: https://dfk-3--qwen35-ws3-v2-infer.modal.run
          description: Qwen-0.8B-v2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DFKRequest'
            examples:
              with_image:
                summary: With image
                value:
                  image_url: "https://file.garden/aiecke1uOU1ol6tV/HOAKS-Vaksin-Covid-19-Mengandung-Magnet-6.jpeg"
                  ringkasan: "Artikel mengklaim vaksin mengandung microchip."
                  klaim: "Vaksin COVID-19 mengandung microchip pemerintah."
                  fakta: "WHO dan CDC menyatakan tidak ada microchip dalam vaksin."
                  max_new_tokens: 128
                  temperature: 0.0
              text_only:
                summary: Text only (no image)
                value:
                  ringkasan: "Unggahan berisi ucapan selamat pagi dan ajakan minum kopi."
                  klaim: "Ucapan selamat pagi dan ajakan minum kopi."
                  fakta: "Tidak ditemukan klaim faktual. Konten bersifat sapaan umum."
                  max_new_tokens: 128
                  temperature: 0.0
      responses:
        '200':
          description: DFK-3 result with MTLA logits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DFKResponse'

  /#qwen-v2-captioning:
    post:
      tags: [Qwen-0.8B-v2]
      summary: Image Captioning
      description: |
        Describe an image in Indonesian. Trigger with `captioning: true` + `image_url`. Adapter disabled.

        Default: kutip teks di gambar → deskripsikan dalam satu paragraf Bahasa Indonesia.

        > **Actual endpoint:** `POST /`
      operationId: qwen_v2_captioning
      servers:
        - url: https://dfk-3--qwen35-ws3-v2-infer.modal.run
          description: Qwen-0.8B-v2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptioningRequest'
            examples:
              default:
                summary: Default instruction
                value:
                  captioning: true
                  image_url: "https://file.garden/aiecke1uOU1ol6tV/HOAKS-Vaksin-Covid-19-Mengandung-Magnet-6.jpeg"
                  max_new_tokens: 256
              custom:
                summary: Custom instruction
                value:
                  captioning: true
                  image_url: "https://file.garden/aiecke1uOU1ol6tV/HOAKS-Vaksin-Covid-19-Mengandung-Magnet-6.jpeg"
                  caption_prompt: "List all visible text, then describe the image in one paragraph."
                  max_new_tokens: 256
      responses:
        '200':
          description: Image caption
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /#qwen-v2-prompt:
    post:
      tags: [Qwen-0.8B-v2]
      summary: Free-form Prompt
      description: |
        Send any prompt. DFK template bypassed, adapter disabled. Image optional.

        > **Actual endpoint:** `POST /`
      operationId: qwen_v2_prompt
      servers:
        - url: https://dfk-3--qwen35-ws3-v2-infer.modal.run
          description: Qwen-0.8B-v2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptRequest'
            examples:
              with_image:
                summary: Prompt with image
                value:
                  prompt: "Identifikasi apakah ada klaim menyesatkan di gambar ini."
                  image_url: "https://file.garden/aiecke1uOU1ol6tV/HOAKS-Vaksin-Covid-19-Mengandung-Magnet-6.jpeg"
                  max_new_tokens: 256
                  temperature: 0.0
      responses:
        '200':
          description: Generated text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /#qwen-v2-messages:
    post:
      tags: [Qwen-0.8B-v2]
      summary: Messages (OpenAI format)
      description: |
        Pass a `messages` array in OpenAI format. Adapter disabled. Supports `image_url` content blocks.

        > **Actual endpoint:** `POST /`
      operationId: qwen_v2_messages
      servers:
        - url: https://dfk-3--qwen35-ws3-v2-infer.modal.run
          description: Qwen-0.8B-v2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessagesRequest'
            examples:
              text:
                summary: Text conversation
                value:
                  messages:
                    - role: system
                      content: "Kamu adalah asisten pendeteksi disinformasi."
                    - role: user
                      content: "Apa itu disinformasi?"
                  max_new_tokens: 256
                  temperature: 0.3
              with_image:
                summary: With image
                value:
                  messages:
                    - role: user
                      content:
                        - type: image_url
                          image_url:
                            url: "https://file.garden/aiecke1uOU1ol6tV/HOAKS-Vaksin-Covid-19-Mengandung-Magnet-6.jpeg"
                        - type: text
                          text: "Analisis gambar ini."
                  max_new_tokens: 256
                  temperature: 0.0
      responses:
        '200':
          description: Generated text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

