components:
  schemas:

    GenerationParams:
      type: object
      properties:
        max_new_tokens:
          type: integer
          default: 128
          minimum: 1
          maximum: 2048
        temperature:
          type: number
          default: 0.0
          minimum: 0.0
          maximum: 2.0
          description: "0 = greedy decoding."
        top_p:
          type: number
          default: 0.8
        top_k:
          type: integer
          default: 20
        min_p:
          type: number
          default: 0.0
        repetition_penalty:
          type: number
          default: 1.0
          minimum: 1.0
        system_role:
          type: string
          description: Inject a system message (prepended before first message, any mode).

    DFKRequest:
      allOf:
        - $ref: '#/components/schemas/GenerationParams'
        - type: object
          properties:
            ringkasan:
              type: string
              description: "Post summary. Alias: `summary`."
            klaim:
              type: string
              description: "Core claim. Alias: `claim`."
            fakta:
              type: string
              description: "Fact-check context. Alias: `fact`."
            image_url:
              type: string
              format: uri
            image_base64:
              type: string
            dfk_prompt:
              type: string
              description: "Override DFK-3 system instruction."

    DFK1Request:
      allOf:
        - $ref: '#/components/schemas/GenerationParams'
        - type: object
          required: [text_classification]
          properties:
            text_classification:
              type: boolean
              enum: [true]
              description: "Trigger for DFK-1 mode. Aliases: `dfk_text`, `dfk1`."
            klaim:
              type: string
              description: "Claim text. Alias: `claim`."
            fakta:
              type: string
              description: "Reference article. Alias: `fact`."
            text_classification_prompt:
              type: string
              description: "Override DFK-1 system instruction."

    CaptioningRequest:
      allOf:
        - $ref: '#/components/schemas/GenerationParams'
        - type: object
          required: [captioning]
          properties:
            captioning:
              type: boolean
              enum: [true]
            image_url:
              type: string
              format: uri
            image_base64:
              type: string
            caption_prompt:
              type: string
              description: "Override default captioning instruction."

    PromptRequest:
      allOf:
        - $ref: '#/components/schemas/GenerationParams'
        - type: object
          required: [prompt]
          properties:
            prompt:
              type: string
            image_url:
              type: string
              format: uri
            image_base64:
              type: string

    MessagesRequest:
      allOf:
        - $ref: '#/components/schemas/GenerationParams'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'

    AdapterMessagesRequest:
      allOf:
        - $ref: '#/components/schemas/GenerationParams'
        - type: object
          required: [adapter_messages, messages]
          properties:
            adapter_messages:
              type: boolean
              enum: [true]
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'

    Message:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ContentBlock'

    ContentBlock:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, image_url]
        text:
          type: string
        image_url:
          type: object
          required: [url]
          properties:
            url:
              type: string
              format: uri

    BaseResponse:
      type: object
      required: [text, tokens_generated, infer_total_ms]
      properties:
        text:
          type: string
        tokens_generated:
          type: integer
          example: 48
        infer_total_ms:
          type: integer
          example: 3800

    DFKResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            logits_label:
              type: string
              description: MTLA predicted label (DFK-3 only).
              enum: [NETRAL, DISINFORMASI, "UJARAN KEBENCIAN", FITNAH]
              example: "DISINFORMASI"
            logits_scores:
              type: object
              description: Softmax confidence per label 0–100 (DFK-3 only).
              properties:
                NETRAL:
                  type: number
                  example: 0.48
                DISINFORMASI:
                  type: number
                  example: 85.42
                UJARAN KEBENCIAN:
                  type: number
                  example: 10.58
                FITNAH:
                  type: number
                  example: 3.52
