  /#merged-dfk-1:
    post:
      tags: [Ministral-8B-Merged]
      summary: DFK-1 Text Classification
      description: |
        Text-only classification. Trigger with `text_classification: true`. DFK adapter active.

        **5 labels** (not merged): `Fakta` · `Disinformasi` · `Fitnah` · `Ujaran Kebencian` · `Non-DFK`

        > `Fakta` and `Non-DFK` are **not** merged into `Netral` — unlike DFK-3.

        Response format: `Label: **NamaLabel.** penjelasan: ...`

        Aliases: `dfk_text: true` · `dfk1: true` · `mode: "dfk_text"`

        > **Actual endpoint:** `POST /`
      operationId: merged_dfk_1
      servers:
        - url: https://dfk-3--ministral-8b-merged-ws3-infer.modal.run
          description: Ministral-8B-Merged
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DFK1Request'
            examples:
              non_dfk:
                summary: Non-DFK (sapaan umum)
                value:
                  text_classification: true
                  klaim: "Selamat pagi semuanya, jangan lupa sarapan dan tetap semangat bekerja hari ini."
                  fakta: "Teks tersebut adalah sapaan dan ajakan umum. Tidak terdapat klaim faktual."
                  max_new_tokens: 128
                  temperature: 0.0
              disinformasi:
                summary: Disinformasi
                value:
                  text_classification: true
                  klaim: "Vaksin menyebabkan autisme pada anak."
                  fakta: "Penelitian ilmiah tidak menemukan hubungan antara vaksin dan autisme."
                  max_new_tokens: 128
                  temperature: 0.0
      responses:
        '200':
          description: DFK-1 text classification (no logits)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
              example:
                text: "Label: **Non-DFK.** penjelasan: Teks ini merupakan sapaan umum. Tidak terdapat klaim faktual, disinformasi, fitnah, atau ujaran kebencian."
                tokens_generated: 52
                infer_total_ms: 4210

